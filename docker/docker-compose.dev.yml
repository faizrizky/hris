# ===========================================================================
# Docker Compose Override untuk Mode Pengembangan (sentra_ats)
#
# Me-mount source code custom app sentra_ats dari direktori lokal ke dalam
# container bench, sehingga perubahan kode Python/JS langsung terbaca
# tanpa harus build image ulang.
#
# Penggunaan:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# ===========================================================================

services:
  configurator:
    volumes:
      - ./apps/sentra_ats:/home/frappe/frappe-bench/apps/sentra_ats

  backend:
    volumes:
      - ./apps/sentra_ats:/home/frappe/frappe-bench/apps/sentra_ats

  queue-short:
    volumes:
      - ./apps/sentra_ats:/home/frappe/frappe-bench/apps/sentra_ats

  queue-long:
    volumes:
      - ./apps/sentra_ats:/home/frappe/frappe-bench/apps/sentra_ats

  queue-browser:
    volumes:
      - ./apps/sentra_ats:/home/frappe/frappe-bench/apps/sentra_ats

  scheduler:
    volumes:
      - ./apps/sentra_ats:/home/frappe/frappe-bench/apps/sentra_ats

  websocket:
    volumes:
      - ./apps/sentra_ats:/home/frappe/frappe-bench/apps/sentra_ats

  frontend:
    volumes:
      - ./apps/sentra_ats:/home/frappe/frappe-bench/apps/sentra_ats
