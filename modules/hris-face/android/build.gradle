plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.hrisface'
version = '0.1.0'

android {
  namespace "expo.modules.hrisface"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // Model deteksi wajah ikut di dalam APK (tanpa unduh saat pertama dipakai).
  implementation 'com.google.mlkit:face-detection:16.1.7'
  // Menjalankan model embedding wajah (SFace, ONNX) di perangkat.
  implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'
}
